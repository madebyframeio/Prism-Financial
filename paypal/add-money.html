<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal | Add Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ppBlue: '#001C64',
                        ppAction: '#0070BA',
                        ppBg: '#FFFFFF',
                        ppSurface: '#F5F7FA',
                        ppBorder: '#E5E7EB'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { letter-spacing: -0.02em; -webkit-tap-highlight-color: transparent; }
        .flow-container { max-width: 500px; margin: 40px auto; }
        
        /* Bottom Nav shadow */
        .mobile-bottom-nav {
            box-shadow: 0 -4px 20px -5px rgba(0, 0, 0, 0.05);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Hide number input spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-ppSurface text-slate-900 min-h-screen">

    <!-- Header Navigation -->
    <nav class="bg-ppBg border-b border-ppBorder sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-10">
                <img src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-mark-color.svg" class="h-6">
                <div class="hidden md:flex gap-8 text-[13px] font-semibold text-ppBlue">
                    <a href="dashboard.html" class="hover:text-ppAction">Summary</a>
                    <a href="activity.html" class="hover:text-ppAction">Activity</a>
                    <a href="send.html" class="hover:text-ppAction">Send & Request</a>
                    <a href="wallet.html" class="hover:text-ppAction">Wallet</a>
                </div>
            </div>
            <div class="flex items-center gap-5">
                <button onclick="window.location.href='dashboard.html'" class="text-[12px] font-bold text-ppBlue uppercase tracking-wider hover:opacity-70">Cancel</button>
            </div>
        </div>
    </nav>

    <!-- Mobile Bottom Navigation -->
    <div class="md:hidden fixed bottom-0 left-0 w-full bg-ppBg border-t border-ppBorder flex items-center justify-around h-16 z-50 mobile-bottom-nav">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="ph ph-house text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Home</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center gap-1 text-ppAction">
            <i class="ph ph-wallet-fill text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Wallet</span>
        </a>
        <a href="send.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="ph ph-paper-plane-tilt text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Pay</span>
        </a>
        <a href="activity.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="ph ph-clock-counter-clockwise text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Activity</span>
        </a>
    </div>

    <main class="max-w-5xl mx-auto px-6 py-12 pb-24 md:pb-12">
        <div class="flow-container">
            
            <!-- Back Button -->
            <div class="mb-8">
                <a href="dashboard.html" class="inline-flex items-center gap-2 text-ppAction font-bold text-sm hover:underline">
                    <i class="ph ph-arrow-left"></i> Back to Dashboard
                </a>
            </div>

            <div id="setup-view">
                <h1 class="text-2xl font-extrabold text-ppBlue mb-8 text-center">Add Money</h1>
                <div class="bg-ppBg border border-ppBorder rounded-2xl p-8 shadow-sm">
                    
                    <div class="mb-10 text-center">
                        <label class="text-xs font-bold text-ppBlue opacity-40 uppercase tracking-widest block mb-6">Enter Amount</label>
                        <div class="flex items-center justify-center gap-1">
                            <span id="add-currency-symbol" class="text-4xl font-extrabold text-ppBlue">$</span>
                            <input type="number" id="add-amount" placeholder="0.00" step="0.01" 
                                class="w-32 bg-transparent text-5xl font-extrabold text-ppBlue text-center outline-none border-b-2 border-ppBorder focus:border-ppAction pb-2">
                        </div>
                    </div>

                    <button onclick="executeAdd()" id="btn-add" class="w-full py-4 bg-ppAction text-white rounded-full font-extrabold text-lg hover:bg-ppBlue transition-all shadow-lg">Add Money</button>
                    
                    <p class="text-center text-[11px] text-slate-400 mt-6 leading-relaxed px-4">
                        Funds typically arrive in your PayPal balance within 1-3 business days. Some banks may take longer.
                    </p>
                </div>
            </div>

            <div id="success-view" class="hidden text-center">
                <div class="bg-ppBg border border-ppBorder rounded-2xl p-12 shadow-sm">
                    <div class="h-20 w-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-8">
                        <i class="ph ph-clock-bold text-4xl"></i>
                    </div>
                    <h2 class="text-3xl font-extrabold text-ppBlue mb-4">Request Sent</h2>
                    <p class="text-slate-500 mb-8">Your request to add <span id="final-amount" class="font-bold text-ppBlue">---</span> is pending and will be added once processed.</p>
                    
                    <button onclick="window.location.href='dashboard.html'" class="w-full py-4 bg-ppBlue text-white rounded-full font-bold">Go to Dashboard</button>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../utils.js"></script>
    <script>
        let currentUser = null;

        async function init() {
            await utils.init();
            currentUser = utils.getCurrentUser();
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const data = await utils.getUserData(currentUser.id);
            currentUser.currency = data?.currency || 'USD';
            document.getElementById('add-currency-symbol').textContent = utils.formatCurrency(0, currentUser.currency).symbol;
        }

        async function executeAdd() {
            const amount = parseFloat(document.getElementById('add-amount').value);
            const btn = document.getElementById('btn-add');

            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-circle-notch animate-spin"></i> Processing...';

            try {
                // Execute Add (PENDING Credit Transaction)
                const { data: tx, error } = await utils.supabase.from('transactions').insert([{
                    user_id: currentUser.id,
                    amount: amount,
                    type: 'credit',
                    description: 'Add Funds Request',
                    status: 'pending'
                }]).select('id').single();

                if (error) throw error;

                // Success
                document.getElementById('final-amount').textContent = utils.formatCurrency(amount, currentUser.currency);
                document.getElementById('setup-view').classList.add('hidden');
                document.getElementById('success-view').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert('Transaction failed: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Add Money';
            }
        }

        init();
    </script>
</body>
</html>
