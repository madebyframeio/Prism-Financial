<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal | Receipt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ppBlue: '#001C64',
                        ppAction: '#0070BA',
                        ppBg: '#FFFFFF',
                        ppSurface: '#F5F7FA',
                        ppBorder: '#E5E7EB'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { letter-spacing: -0.02em; -webkit-tap-highlight-color: transparent; }
        .receipt-container { max-width: 450px; margin: 40px auto; }
        
        /* Bottom Nav shadow */
        .mobile-bottom-nav {
            box-shadow: 0 -4px 20px -5px rgba(0, 0, 0, 0.05);
            padding-bottom: env(safe-area-inset-bottom);
        }
        @media print {
            .no-print { display: none; }
            body { background: white; }
            .receipt-container { margin: 0; border: none; }
        }
    </style>
</head>
<body class="bg-ppSurface text-slate-900 min-h-screen">

    <div class="no-print bg-ppBg border-b border-ppBorder sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="dashboard.html" class="flex items-center gap-2 text-ppAction font-bold text-sm">
                <i class="ph ph-arrow-left"></i> <span class="hidden md:inline">Back to Dashboard</span><span class="md:hidden">Back</span>
            </a>
            <button onclick="window.print()" class="text-ppBlue font-bold text-sm flex items-center gap-2">
                <i class="ph ph-printer"></i> <span class="hidden md:inline">Print Receipt</span><span class="md:hidden">Print</span>
            </button>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="md:hidden fixed bottom-0 left-0 w-full bg-ppBg border-t border-ppBorder flex items-center justify-around h-16 z-50 mobile-bottom-nav">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="ph ph-house text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Home</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="ph ph-wallet text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Wallet</span>
        </a>
        <a href="send.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="ph ph-paper-plane-tilt text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Pay</span>
        </a>
        <a href="activity.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i class="ph ph-clock-counter-clockwise text-[24px]"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Activity</span>
        </a>
    </div>

    <div class="receipt-container bg-ppBg border border-ppBorder rounded-2xl p-8 md:p-12 shadow-sm">
        <div class="text-center mb-8">
            <img src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-mark-color.svg" class="h-10 mx-auto mb-6">
            <h1 class="text-2xl font-extrabold text-ppBlue mb-2">Transaction Receipt</h1>
            <p id="receipt-date" class="text-sm text-slate-400">Loading date...</p>
        </div>

        <div class="space-y-6">
            <div class="py-4 border-b border-ppBorder border-dashed">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Transaction ID</p>
                <p id="receipt-id" class="text-ppBlue font-medium font-mono text-xs break-all">---</p>
            </div>

            <div class="py-4">
                <p class="text-slate-400 font-medium mb-1">Description</p>
                <p id="receipt-desc" class="text-ppBlue font-bold text-lg">---</p>
            </div>

            <div class="py-4 bg-ppSurface rounded-xl p-6 text-center">
                <p class="text-[10px] font-bold text-ppBlue opacity-40 uppercase tracking-widest mb-1">Amount</p>
                <p id="receipt-amount" class="text-3xl font-extrabold text-ppBlue">$0.00</p>
                <p id="receipt-status" class="mt-2 inline-block px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold uppercase tracking-widest">Completed</p>
            </div>

            <div class="space-y-4 pt-4">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Paid with</span>
                    <span class="text-ppBlue font-bold">PayPal Balance</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Transaction fee</span>
                    <span class="text-emerald-600 font-bold">$0.00</span>
                </div>
            </div>
        </div>

        <div class="mt-12 text-center">
            <p class="text-[11px] text-slate-400 leading-relaxed">
                Thank you for using PayPal. This is a computer-generated receipt and does not require a signature.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../utils.js"></script>
    <script>
        async function loadReceipt() {
            await utils.init();
            const urlParams = new URLSearchParams(window.location.search);
            const txId = urlParams.get('txId');

            if (!txId) {
                alert('No transaction ID provided');
                window.location.href = 'dashboard.html';
                return;
            }

            try {
                const { data: tx, error } = await utils.supabase
                    .from('transactions')
                    .select('*')
                    .eq('id', txId)
                    .single();

                if (error || !tx) throw error || new Error('Transaction not found');

                const userData = await utils.getUserData(tx.user_id);
                const userCurrency = userData?.currency || 'USD';

                document.getElementById('receipt-id').textContent = tx.id;
                document.getElementById('receipt-desc').textContent = tx.description;
                document.getElementById('receipt-amount').textContent = (tx.type === 'debit' ? '-' : '+') + utils.formatCurrency(tx.amount, userCurrency);
                document.getElementById('receipt-date').textContent = new Date(tx.created_at).toLocaleString('en-US', { 
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });

                const statusEl = document.getElementById('receipt-status');
                statusEl.textContent = tx.status.charAt(0).toUpperCase() + tx.status.slice(1);
                if (tx.status === 'pending') {
                    statusEl.className = 'mt-2 inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-[10px] font-bold uppercase tracking-widest';
                } else if (tx.status === 'rejected') {
                    statusEl.className = 'mt-2 inline-block px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-[10px] font-bold uppercase tracking-widest';
                }

            } catch (err) {
                console.error(err);
                alert('Failed to load receipt details');
            }
        }

        loadReceipt();
    </script>
</body>
</html>
