<!DOCTYPE html>
<html lang="en">

<head>
    <script src="app-v1.js"></script>
    <style>.hidden-cloak { opacity: 0 !important; pointer-events: none !important; }</style>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Authorize Transaction | WithCitii Secure</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#056dae",
                        secondary: "#004B8D",
                        accent: "#FCCC44",
                        bankGray: "#F4F4F4",
                        bankText: "#333333",
                        borderGray: "#D1D1D1"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-slate-900 text-bankText font-sans antialiased; }
        }
    </style>
    <link rel="icon" type="image/png" href="logo.png">

    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow">

    <!-- Social Meta Tags -->
    <meta property="og:description"
        content="Secure, simplified, and powerful online banking. Access your dashboard, track your transactions, and manage your assets with WithCitii.">
    <meta property="og:image"
        content="https://raw.githubusercontent.com/madebyframeio/WithCitii-Project/main/meta.png">
    <meta property="og:url" content="https://withcitii.netlify.app/">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description"
        content="Secure, simplified, and powerful online banking. Access your dashboard, track your transactions, and manage your assets with WithCitii.">
    <meta name="twitter:image"
        content="https://raw.githubusercontent.com/madebyframeio/WithCitii-Project/main/meta.png">
</head>

<body
    class="hidden-cloak min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950">
    <div class="max-w-md w-full bg-white p-10 border border-slate-700 shadow-2xl rounded-sm relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-primary"></div>

        <div class="text-center mb-10">
            <div
                class="w-16 h-16 bg-primary/5 text-primary rounded-full flex items-center justify-center mx-auto mb-6 border-2 border-primary/20">
                <span class="material-symbols-outlined text-4xl">verified_user</span>
            </div>
            <h1 class="text-2xl font-black uppercase tracking-tighter text-bankText leading-none mb-2">Secure Authorization</h1>
            <p class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-400">Verification protocol required</p>
        </div>

        <p class="text-xs font-semibold text-center mb-10 leading-relaxed text-gray-500">
            To finalize this request, please input the 6-digit verification code dispatched to your primary WithCitii device.
        </p>

        <form onsubmit="verifyCode(event)">
            <div class="mb-10">
                <input type="text" id="code" maxlength="6"
                    class="w-full text-center text-4xl font-black tracking-[0.4em] border-b-4 border-bankGray focus:border-primary outline-none py-4 text-bankText placeholder:text-gray-200 transition-all font-mono"
                    placeholder="000000" required>
            </div>

            <button type="submit"
                class="w-full py-4 bg-primary text-white font-black uppercase tracking-widest text-[11px] hover:bg-blue-900 transition-all shadow-md active:scale-95 rounded-sm">
                AUTHORIZE SECURELY
            </button>
        </form>

        <div class="mt-10 text-center">
            <a href="dashboard.html"
                class="text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-primary transition-colors">Abort Request</a>
        </div>
    </div>

    <!-- Encryption Badge -->
    <div class="fixed bottom-0 left-0 w-full bg-black/50 py-3 text-center pointer-events-none border-t border-white/5 backdrop-blur-sm">
        <div class="flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-xs text-emerald-400">enhanced_encryption</span>
            <p class="text-[9px] uppercase tracking-[0.4em] font-black text-white/40">
                Advanced WithCitii Encryption Active
            </p>
        </div>
    </div>

    <script>
        function verifyCode(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "AUTHORIZING...";
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = 'processing.html';
            }, 1200);
        }
    </script>
</body>

</html>
